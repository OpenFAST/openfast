name: 'HydroDyn module tests'
description: 'Run tests specific to the HydroDyn module'
author: 'Rafael Mudafort https://github.com/rafmudaf'
runs:
  using: "composite"
  steps:  
    - run: ctest -VV -R hd_ -LE python   # parallelism from CTEST_PARALLEL_LEVEL (see automated-dev-tests.yml)
      working-directory: ${{runner.workspace}}/openfast/build
      shell: bash
