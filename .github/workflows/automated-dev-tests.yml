
name: 'Development Pipeline'

#-------------------------------------------------------------------------------
# Notes
# - ATLAS BLAS is used instead of OpenBLAS because it gives more consistent
#   results when OpenMP is enabled. This is likely due to a bug in OpenBLAS.
#-------------------------------------------------------------------------------

on:
  push:
    paths-ignore:
      - 'LICENSE'
      - 'README.rst'
      - 'docs/**'
      - 'share/**'
      - 'vs-build/**'

  pull_request:
    types: [opened, synchronize, edited, reopened] #labeled, assigned]
    # Pull request event triggers are unrelated to paths
    # paths-ignore:

env:
  FORTRAN_COMPILER: gfortran-14
  CXX_COMPILER: g++-14
  C_COMPILER: gcc-14
  GCOV_EXE: gcov-14
  CMAKE_BUILD_PARALLEL_LEVEL: 8
  CTEST_PARALLEL_LEVEL: 4
  OMP_NUM_THREADS: 1

jobs:

  #-----------------------------------------------------------------------------
  #  BUILD JOBS
  #-----------------------------------------------------------------------------

  build-all-debug-single:
    # Tests compiling in debug mode with single precision; saves the unit tests for utest-debug-single.
    # This workspace is not used by any other subtests, it checks type errors of the type ReKi/R8Ki
    # Debug speeds up the build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive   # BUILD_TESTING requires reg_tests/r-test
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev libhdf5-dev libnetcdf-dev libopenmpi-dev libyaml-cpp-dev
      - name: Setup workspace
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DPython_ROOT_DIR:PATH=${{env.pythonLocation}} \
            -DBLA_VENDOR:STRING=ATLAS \
            -DCMAKE_BUILD_TYPE:STRING=DEBUG \
            -DVARIABLE_TRACKING:BOOL=OFF \
            -DDOUBLE_PRECISION:BOOL=OFF \
            -DBUILD_TESTING:BOOL=ON \
            -DBUILD_OPENFAST_CPP_API:BOOL=ON \
            -DBUILD_OPENFAST_LIB_DRIVER:BOOL=ON \
            -DBUILD_OPENFAST_CPP_DRIVER:BOOL=ON \
            -DBUILD_FASTFARM:BOOL=ON \
            ${GITHUB_WORKSPACE}
      - name: Build all
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --target all
      - name: Archive build
        run: |
          # The unit test executables are statically linked against OpenFAST, so
          # build/unit_tests (without object files) is all the unit test job needs.
          tar -cf build.tar -C ${{github.workspace}} --exclude='CMakeFiles' build/unit_tests
      - name: Save build for unit tests
        uses: actions/upload-artifact@v6
        with:
          name: build-all-debug-single
          path: build.tar

  utest-debug-single:
    # Runs the unit tests on the single-precision gfortran Debug build.
    runs-on: ubuntu-24.04
    needs: build-all-debug-single
    steps:
      # Checkout and compilers are needed by aerodyn_utest_trapping_flags, which
      # configures a small CMake project from cmake/tests/aerodyn_trapping.
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore build from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-all-debug-single
      - name: Untar build
        run: |
          tar -xf build.tar -C ${{github.workspace}}
          rm build.tar
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev
      - name: Run unit tests
        working-directory: ${{github.workspace}}/build/unit_tests
        run: |
          ctest -VV -R "_utest"
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: utest-debug-single
          path: |
            ${{github.workspace}}/build/unit_tests

  build-all-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: List files in workspace
        run: ls ${{github.workspace}}
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev libhdf5-dev libnetcdf-dev libopenmpi-dev libyaml-cpp-dev
      - name: Setup workspace
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DPython_ROOT_DIR:PATH=${{env.pythonLocation}} \
            -DBUILD_SHARED_LIBS:BOOL=OFF \
            -DBLA_VENDOR:STRING=ATLAS \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
            -DVARIABLE_TRACKING:BOOL=OFF \
            -DBUILD_TESTING:BOOL=ON \
            -DCTEST_PLOT_ERRORS:BOOL=ON \
            -DOPENMP:BOOL=ON \
            -DDOUBLE_PRECISION=ON \
            -DBUILD_OPENFAST_CPP_API:BOOL=ON \
            -DBUILD_OPENFAST_LIB_DRIVER:BOOL=ON \
            -DBUILD_OPENFAST_CPP_DRIVER:BOOL=ON \
            -DBUILD_FASTFARM:BOOL=ON \
            -DAMREX_READER=ON \
            ${GITHUB_WORKSPACE}
      - name: Build all
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --target all
      - name: Archive files
        run: |
          tar -cvf workspace.tar -C ${{github.workspace}} \
          --exclude='*.a' --exclude='*.o' --exclude='build/ftnmods' \
          --exclude='docs' --exclude='vs-build' \
          .
      - name: Save workspace for other jobs
        uses: actions/upload-artifact@v6
        with:
          name: build-all-release
          path: workspace.tar

  utest-release:
    # Runs the unit tests on the release build before the regression test jobs.
    runs-on: ubuntu-24.04
    needs: build-all-release
    steps:
      - name: Restore workspace from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-all-release
      - name: Untar workspace
        run: |
          tar -xf workspace.tar -C ${{github.workspace}}
          rm workspace.tar
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev
      - name: Run unit tests
        working-directory: ${{github.workspace}}/build/unit_tests
        run: |
          ctest -VV -R "_utest"
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: utest-release
          path: |
            ${{github.workspace}}/build/unit_tests

  #-----------------------------------------------------------------------------
  #  BUILD AND TEST JOBS
  #-----------------------------------------------------------------------------

  build-all-test-modules-debug:
    # Tests compiling in debug mode.
    # Also compiles the Registry and generates new types files.
    # Debug more speeds up the build.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ${{github.workspace}}
        run: |
          pip install -r requirements.txt
          pip install glue-codes/python/.   # Installs the interface library
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev
      - name: Setup workspace
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DPython_ROOT_DIR:PATH=${{env.pythonLocation}} \
            -DBLA_VENDOR:STRING=ATLAS \
            -DCMAKE_BUILD_TYPE:STRING=DEBUG \
            -DGENERATE_TYPES:BOOL=ON \
            -DVARIABLE_TRACKING:BOOL=OFF \
            -DBUILD_TESTING:BOOL=ON \
            -DCTEST_PLOT_ERRORS:BOOL=ON \
            -DAMREX_READER=ON \
            ${GITHUB_WORKSPACE}
            # -DDOUBLE_PRECISION=OFF \
      - name: Build all
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --target all
      - name: Run UnsteadyAero tests
        working-directory: ${{github.workspace}}/build
        shell: bash
        run: |
          ctest -VV -R "^ua_" 
      - name: Run AeroDyn tests
        uses: ./.github/actions/tests-module-aerodyn
        with:
          # Don't run regression tests here since they currently fail inconsistently
          test-target: unit
      - name: Run BeamDyn tests
        uses: ./.github/actions/tests-module-beamdyn
      - name: Run HydroDyn tests
        uses: ./.github/actions/tests-module-hydrodyn
      - name: Run InflowWind tests
        uses: ./.github/actions/tests-module-inflowwind
      - name: Run MoorDyn tests
        uses: ./.github/actions/tests-module-moordyn
      - name: Run NWTC Library tests
        uses: ./.github/actions/tests-module-nwtclibrary
      - name: Run SeaState tests
        uses: ./.github/actions/tests-module-seastate
      - name: Run SubDyn tests
        uses: ./.github/actions/tests-module-subdyn
      - name: Run VersionInfo tests
        uses: ./.github/actions/tests-module-version
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: rtest-modules-debug
          path: |
            ${{github.workspace}}/build/reg_tests/modules
            ${{github.workspace}}/build/unit_tests


  # LLVM Flang jobs: compile with LLVM Flang (and clang/clang++) in debug mode in double
  # and single precision, then run the unit tests on each build
  # (utest-llvm-flang-debug-double/-single). No regression tests are run with LLVM Flang.
  # FAST.Farm and the C library driver are built as well; the C++ API is not, since it
  # adds no Fortran and is covered by the gfortran jobs.
  # The toolchain comes from conda-forge, pinned and updated deliberately. flang_linux-64
  # pulls in the Fortran runtime (libflang-rt). conda-forge clang/flang use their own
  # sysroot and link from $CONDA_PREFIX/lib (with rpath), so BLAS/LAPACK also come from
  # conda-forge rather than apt.
  # Pinned to 22.1.8: the conda-forge flang 23.1.x packages (through 23.1.4) do not ship
  # the intrinsic module files (iso_c_binding.mod, iso_fortran_env.mod, ...), so nothing
  # that USEs them compiles. 22.1.8 ships them in include/flang.
  # Keep LLVM_VERSION and the micromamba create-args identical in all four jobs: the unit
  # test job recreates the same environment (same prefix) so the rpaths in the downloaded
  # executables (flang runtime, OpenBLAS) resolve.

  build-llvm-flang-debug-double:
    # Builds with LLVM Flang in double precision; saves the build for utest-llvm-flang-debug-double.
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: '22.1.8'
      # Override the workflow-level gfortran/gcc settings for this job.
      FORTRAN_COMPILER: flang
      CXX_COMPILER: clang++
      C_COMPILER: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install LLVM Flang
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm-flang
          create-args: >-
            -c conda-forge
            flang_linux-64=${{env.LLVM_VERSION}}
            clang=${{env.LLVM_VERSION}}
            clangxx=${{env.LLVM_VERSION}}
            openblas
            libblas=*=*openblas
            liblapack
            cmake
            ninja
          cache-environment: true
      - name: Compiler versions
        shell: bash -el {0}
        run: |
          ${{env.FORTRAN_COMPILER}} --version
          ${{env.C_COMPILER}} --version
          ${{env.CXX_COMPILER}} --version
      - name: Configure build
        shell: bash -el {0}
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${{github.workspace}}/build -G Ninja \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DCMAKE_PREFIX_PATH:PATH=${CONDA_PREFIX} \
            -DBLA_VENDOR:STRING=OpenBLAS \
            -DCMAKE_BUILD_TYPE:STRING=DEBUG \
            -DDOUBLE_PRECISION:BOOL=ON \
            -DBUILD_TESTING:BOOL=ON \
            -DBUILD_OPENFAST_LIB_DRIVER:BOOL=ON \
            -DBUILD_FASTFARM:BOOL=ON
      - name: Build all
        shell: bash -el {0}
        run: |
          cmake --build ${{github.workspace}}/build --target all
      - name: Archive build
        run: |
          # The unit test executables are statically linked against OpenFAST, so
          # build/unit_tests (without object files) is all the unit test job needs.
          tar -cf build.tar -C ${{github.workspace}} --exclude='CMakeFiles' build/unit_tests
      - name: Save build for unit tests
        uses: actions/upload-artifact@v6
        with:
          name: build-llvm-flang-debug-double
          path: build.tar

  build-llvm-flang-debug-single:
    # Builds with LLVM Flang in single precision; saves the build for utest-llvm-flang-debug-single.
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: '22.1.8'
      # Override the workflow-level gfortran/gcc settings for this job.
      FORTRAN_COMPILER: flang
      CXX_COMPILER: clang++
      C_COMPILER: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install LLVM Flang
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm-flang
          create-args: >-
            -c conda-forge
            flang_linux-64=${{env.LLVM_VERSION}}
            clang=${{env.LLVM_VERSION}}
            clangxx=${{env.LLVM_VERSION}}
            openblas
            libblas=*=*openblas
            liblapack
            cmake
            ninja
          cache-environment: true
      - name: Compiler versions
        shell: bash -el {0}
        run: |
          ${{env.FORTRAN_COMPILER}} --version
          ${{env.C_COMPILER}} --version
          ${{env.CXX_COMPILER}} --version
      - name: Configure build
        shell: bash -el {0}
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${{github.workspace}}/build -G Ninja \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DCMAKE_PREFIX_PATH:PATH=${CONDA_PREFIX} \
            -DBLA_VENDOR:STRING=OpenBLAS \
            -DCMAKE_BUILD_TYPE:STRING=DEBUG \
            -DDOUBLE_PRECISION:BOOL=OFF \
            -DBUILD_TESTING:BOOL=ON \
            -DBUILD_OPENFAST_LIB_DRIVER:BOOL=ON \
            -DBUILD_FASTFARM:BOOL=ON
      - name: Build all
        shell: bash -el {0}
        run: |
          cmake --build ${{github.workspace}}/build --target all
      - name: Archive build
        run: |
          # The unit test executables are statically linked against OpenFAST, so
          # build/unit_tests (without object files) is all the unit test job needs.
          tar -cf build.tar -C ${{github.workspace}} --exclude='CMakeFiles' build/unit_tests
      - name: Save build for unit tests
        uses: actions/upload-artifact@v6
        with:
          name: build-llvm-flang-debug-single
          path: build.tar

  utest-llvm-flang-debug-double:
    # Runs the unit tests on the double-precision LLVM Flang build.
    runs-on: ubuntu-24.04
    needs: build-llvm-flang-debug-double
    env:
      LLVM_VERSION: '22.1.8'
      # Override the workflow-level gfortran/gcc settings (must match the build job).
      FORTRAN_COMPILER: flang
      CXX_COMPILER: clang++
      C_COMPILER: clang
    steps:
      # Checkout and compilers are needed by aerodyn_utest_trapping_flags, which
      # configures a small CMake project from cmake/tests/aerodyn_trapping.
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore build from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-llvm-flang-debug-double
      - name: Untar build
        run: |
          tar -xf build.tar -C ${{github.workspace}}
          rm build.tar
      - name: Install LLVM Flang
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm-flang
          create-args: >-
            -c conda-forge
            flang_linux-64=${{env.LLVM_VERSION}}
            clang=${{env.LLVM_VERSION}}
            clangxx=${{env.LLVM_VERSION}}
            openblas
            libblas=*=*openblas
            liblapack
            cmake
            ninja
          cache-environment: true
      - name: Run unit tests
        shell: bash -el {0}
        working-directory: ${{github.workspace}}/build/unit_tests
        run: |
          ctest -VV -R "_utest"
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: utest-llvm-flang-debug-double
          path: |
            ${{github.workspace}}/build/unit_tests


  utest-llvm-flang-debug-single:
    # Runs the unit tests on the single-precision LLVM Flang build.
    runs-on: ubuntu-24.04
    needs: build-llvm-flang-debug-single
    env:
      LLVM_VERSION: '22.1.8'
      # Override the workflow-level gfortran/gcc settings (must match the build job).
      FORTRAN_COMPILER: flang
      CXX_COMPILER: clang++
      C_COMPILER: clang
    steps:
      # Checkout and compilers are needed by aerodyn_utest_trapping_flags, which
      # configures a small CMake project from cmake/tests/aerodyn_trapping.
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore build from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-llvm-flang-debug-single
      - name: Untar build
        run: |
          tar -xf build.tar -C ${{github.workspace}}
          rm build.tar
      - name: Install LLVM Flang
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: llvm-flang
          create-args: >-
            -c conda-forge
            flang_linux-64=${{env.LLVM_VERSION}}
            clang=${{env.LLVM_VERSION}}
            clangxx=${{env.LLVM_VERSION}}
            openblas
            libblas=*=*openblas
            liblapack
            cmake
            ninja
          cache-environment: true
      - name: Run unit tests
        shell: bash -el {0}
        working-directory: ${{github.workspace}}/build/unit_tests
        run: |
          ctest -VV -R "_utest"
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: utest-llvm-flang-debug-single
          path: |
            ${{github.workspace}}/build/unit_tests


  build-test-OF-simulink:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: Simulink
      - name: Setup workspace
        run: cmake -E make_directory ${{github.workspace}}/build
      - name: Configure build
        working-directory: ${{github.workspace}}/build
        run: |
          cmake \
            -DCMAKE_INSTALL_PREFIX:PATH=${{github.workspace}}/install \
            -DCMAKE_Fortran_COMPILER:STRING=${{env.FORTRAN_COMPILER}} \
            -DCMAKE_CXX_COMPILER:STRING=${{env.CXX_COMPILER}} \
            -DCMAKE_C_COMPILER:STRING=${{env.C_COMPILER}} \
            -DPython_ROOT_DIR:PATH=${{env.pythonLocation}} \
            -DBUILD_OPENFAST_SIMULINK_API:BOOL=ON \
            -DUSE_LOCAL_STATIC_LAPACK:BOOL=ON \
            -DCMAKE_BUILD_TYPE:STRING=DEBUG \
            -DGENERATE_TYPES:BOOL=ON \
            -DVARIABLE_TRACKING:BOOL=OFF \
            ${GITHUB_WORKSPACE}
      - name: Build FAST_SFunc
        working-directory: ${{github.workspace}}/build
        run: |
          cmake --build . --target FAST_SFunc
      - name: Run MATLAB tests and generate artifacts
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: ${{github.workspace}}/build/glue-codes/simulink; ${{github.workspace}}/glue-codes/simulink/examples
          test-results-junit: test-results/results.xml
          code-coverage-cobertura: code-coverage/coverage.xml

  #-----------------------------------------------------------------------------
  #  TEST JOBS
  #-----------------------------------------------------------------------------

  rtest-module-drivers:
    runs-on: ubuntu-24.04
    needs: utest-release
    steps:
      - name: Restore workspace from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-all-release
      - name: Untar workspace
        run: |
          tar -xf workspace.tar -C ${{github.workspace}}
          rm workspace.tar
      - name: List files in workspace
        run: ls
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ${{github.workspace}}
        run: |
          pip install -r requirements.txt
          pip install glue-codes/python/.   # Installs the interface library
          sudo apt-get update -y
          sudo apt-get install -y libatlas-base-dev
          sudo apt-get install -y libhdf5-dev libnetcdf-dev libopenmpi-dev libyaml-cpp-dev
      - name: Configure Tests
        working-directory: ${{github.workspace}}/build
        run: |
          cmake \
            -DPython_ROOT_DIR:PATH=${{env.pythonLocation}} \
            -DBUILD_TESTING:BOOL=ON \
            -DCTEST_PLOT_ERRORS:BOOL=ON \
            ${GITHUB_WORKSPACE}
      - name: Run AeroDyn tests
        uses: ./.github/actions/tests-module-aerodyn
        with:
          test-target: regression
      - name: Run BeamDyn tests
        uses: ./.github/actions/tests-module-beamdyn
        with:
          test-target: regression
      - name: Run HydroDyn tests
        uses: ./.github/actions/tests-module-hydrodyn
      - name: Run InflowWind tests
        uses: ./.github/actions/tests-module-inflowwind
        with:
          test-target: regression
      - name: Run MoorDyn tests
        uses: ./.github/actions/tests-module-moordyn
      - name: Run SeaState tests
        uses: ./.github/actions/tests-module-seastate
      - name: Run SubDyn tests
        uses: ./.github/actions/tests-module-subdyn
      - name: Failing test artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: rtest-module-drivers
          path: |
            ${{github.workspace}}/build/reg_tests/modules


  rtest-interfaces:
    runs-on: ubuntu-24.04
    needs: utest-release
    steps:
      - name: Restore workspace from artifact
        uses: actions/download-artifact@v7
        with:
          name: build-all-release
      - name: Untar workspace
        run: |
          tar -xf workspace.tar -C ${{github.workspace}}
          rm workspace.tar
      - name: List files in workspace
        run: ls
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: ${{github.workspace}}
        run: |
          pip install -r requirements.txt
          pip install glue-codes/python/.   # Installs the interface library
          sudo apt-get update -y
